<title>Houston Matchbox Hunt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;1,500&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/*LEAFLET_CSS*/
</style>
<style>
/* Layout: one-screen app. A soft beige city map on the left, a cream panel listing spots by neighborhood on the right; map over list on phones. */
:root {
  /* One committed light look, after the "beige and light" map reference: beige land, sage parks, olive pins, butter yellow for what you've collected. */
  --bg: #f6ecdc;          /* beige */
  --panel: #fbf5ea;       /* cream */
  --ink: #23331f;         /* deep forest */
  --muted: #7b7a5c;       /* olive grey */
  --line: #e7dac4;
  --land: #f3e6d1;
  --park: #dfdcab;        /* sage */
  --road: #fbf3e6;
  --road-edge: #e3d2b7;
  --water: #b3c7cb;
  --head: #6e7c33;        /* olive: still stocked */
  --head-ink: #fbf5ea;
  --forest: #1f3a2c;      /* selected pin */
  --sulfur: #f2d36b;      /* butter yellow: collected */
  --sulfur-ink: #4a4014;
  --out: #b8a88c;         /* reported out */
  --strip: repeating-linear-gradient(90deg, #6e7c33 0 3px, #f2d36b 3px 6px);
  --chip: #fffaf1;
  --display: "Cormorant", "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; }
.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 380px; grid-template-rows: auto minmax(0, 1fr); }
header {
  grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line); position: relative;
}
header::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: var(--strip); }
h1 { margin: 0; font-family: var(--display); font-weight: 500; font-size: 28px; letter-spacing: -.005em; line-height: 1.05; text-wrap: balance; }
h1 span { font-style: italic; color: var(--head); }
.tally { display: flex; gap: 22px; flex-wrap: wrap; margin-left: auto; font-variant-numeric: tabular-nums; }
.tally div { display: flex; flex-direction: column; gap: 2px; }
.tally b { font-family: var(--display); font-weight: 600; font-size: 24px; line-height: 1; }
.tally small { font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.tally .got b { color: var(--ink); background: linear-gradient(transparent 55%, var(--sulfur) 55%); padding: 0 2px; }
.tally .live b { color: var(--head); }
.tally .out b { color: var(--out); }
#map { background: var(--land); min-height: 0; }
aside { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.controls { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
#q { width: 100%; box-sizing: border-box; font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--chip); color: var(--ink); }
#q::placeholder { color: var(--muted); }
#q:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--head); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { font: inherit; font-size: 12.5px; font-weight: 600; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--forest); color: var(--panel); border-color: var(--forest); }
.areas { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px; border-bottom: 1px solid var(--line); scrollbar-width: none; }
.areas::-webkit-scrollbar { display: none; }
.cats { padding-top: 0; }
.cats button { border-style: dashed; }
.areas.cats button[aria-pressed="true"] { background: var(--forest); border: 1px solid var(--forest); color: var(--panel); }
.areas.cats button[aria-pressed="true"] span { color: var(--panel); opacity: .7; }
.areas button { flex: none; font: 600 12.5px var(--body); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; white-space: nowrap; }
.areas button span { color: var(--muted); font-weight: 500; margin-left: 5px; font-variant-numeric: tabular-nums; }
.areas button[aria-pressed="true"] { background: var(--sulfur); border-color: var(--sulfur); color: var(--sulfur-ink); }
.areas button[aria-pressed="true"] span { color: var(--sulfur-ink); opacity: .7; }
.showing { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 16px; background: color-mix(in srgb, var(--sulfur) 30%, var(--panel)); font-size: 12.5px; border-bottom: 1px solid var(--line); }
.showing button { font: 600 12.5px var(--body); color: var(--forest); background: none; border: 0; padding: 4px 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.list { overflow-y: auto; flex: 1; min-height: 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
.hood { position: sticky; top: 0; z-index: 1; background: var(--panel); padding: 12px 16px 6px; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .14em; color: var(--head); display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 11px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
.row:hover, .row.sel { background: color-mix(in srgb, var(--park) 35%, transparent); }
.row .nm { font-family: var(--display); font-weight: 600; font-size: 18px; line-height: 1.15; }
.row .nm em { font-family: var(--body); font-style: normal; font-weight: 500; color: var(--muted); font-size: 12px; }
.row .ad { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-top: 3px; }
.row.out .nm { color: var(--muted); }
.pill { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: 3px 8px; border-radius: 999px; white-space: nowrap; margin-top: 2px; }
.pill.live { background: color-mix(in srgb, var(--head) 14%, transparent); color: var(--head); }
.pill.out { background: color-mix(in srgb, var(--out) 22%, transparent); color: var(--muted); }
.pill.got { background: var(--sulfur); color: var(--sulfur-ink); }
/* the "box" toggle: a tiny matchbox, filled butter yellow when collected */
.box { width: 24px; height: 18px; margin-top: 2px; border-radius: 4px; border: 1.5px solid var(--muted); background: transparent; position: relative; cursor: pointer; padding: 0; }
.box::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--strip); opacity: .55; border-radius: 2px 2px 0 0; }
.box[aria-pressed="true"] { background: var(--sulfur); border-color: var(--sulfur-ink); }
.box[aria-pressed="true"]::after { content: ""; position: absolute; left: 7px; top: 3px; width: 5px; height: 9px; border: solid var(--sulfur-ink); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.empty { padding: 28px 16px; color: var(--muted); }
.foot { padding: 10px 16px; font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); line-height: 1.45; }
.foot .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px; margin: 0 3px 0 8px; box-sizing: border-box; }
.foot .dot:first-child { margin-left: 0; }

/* pins */
.pin { width: 20px; height: 20px; border-radius: 50%; background: var(--head); border: 2.5px solid var(--panel); box-shadow: 0 1px 3px rgb(35 51 31 / .3); box-sizing: border-box; }
.pin.out { background: var(--panel); border: 2px dashed var(--out); box-shadow: none; }
.pin.got { background: var(--sulfur); border-color: var(--sulfur-ink); border-width: 2px; }
.pin.sel { background: var(--forest); transform: scale(1.35); }
.pin.got.sel { background: var(--sulfur); outline: 2px solid var(--forest); }
.pin.drag { cursor: move; outline: 2px dashed var(--forest); outline-offset: 3px; }
.plabel { background: none; border: 0; box-shadow: none; padding: 0; color: var(--ink); white-space: nowrap; text-shadow: 0 0 3px var(--land), 0 0 3px var(--land), 0 0 6px var(--land); display: none; }
.plabel::before { display: none; }
.plabel small { display: block; font: 600 9px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--head); }
.plabel b { display: block; font: 500 17px/1.05 var(--display); }
.labels-on .plabel { display: block; }
.far .road-label { display: none; }
.hood-label { font-family: var(--display); font-style: italic; font-size: 16px; color: var(--muted); opacity: .75; white-space: nowrap; background: none; border: 0; }
.road-label { font: 600 9.5px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; text-shadow: 0 0 3px var(--land), 0 0 3px var(--land); }

/* popup */
.leaflet-popup-content-wrapper { background: var(--panel); color: var(--ink); border-radius: 14px; box-shadow: 0 6px 24px rgb(35 51 31 / .18); }
.leaflet-popup-tip { background: var(--panel); }
.leaflet-popup-content { margin: 16px 18px; font-family: var(--body); font-size: 13.5px; line-height: 1.45; min-width: 250px; }
.leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
.pop h3 { margin: 2px 0 2px; font-family: var(--display); font-weight: 500; font-size: 26px; line-height: 1.05; }
.pop .k { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .14em; color: var(--head); }
.pop .a { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 8px 0 8px; }
.pop .n { margin: 0 0 6px; }
.pop .warn { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
.pop .look { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
.pop .look a { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 9px 4px 7px; border-radius: 10px; background: color-mix(in srgb, var(--park) 45%, var(--panel)); color: var(--ink); text-decoration: none; font: 600 11px var(--body); letter-spacing: .02em; }
.pop .look a:hover { background: var(--park); }
.pop .look svg { width: 20px; height: 20px; fill: none; stroke: var(--forest); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.pop .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.pop .acts button, .pop .acts a { font: 600 12.5px var(--body); padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); cursor: pointer; text-decoration: none; }
.pop .acts .primary { background: var(--forest); color: var(--panel); border-color: var(--forest); }
.pop .acts .primary.on { background: var(--sulfur); border-color: var(--sulfur); color: var(--sulfur-ink); }
.leaflet-control-zoom a { background: var(--panel) !important; color: var(--ink) !important; border-color: var(--line) !important; }
.leaflet-bar { border: 1px solid var(--line) !important; box-shadow: none !important; border-radius: 10px !important; overflow: hidden; }
.leaflet-control-attribution { background: color-mix(in srgb, var(--panel) 80%, transparent) !important; color: var(--muted) !important; }
.leaflet-control-attribution a { color: var(--muted) !important; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--forest); color: var(--panel); padding: 9px 16px; border-radius: 999px; font-weight: 600; z-index: 1000; font-size: 13px; }

@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 38% minmax(0, 1fr); }
  .controls { padding-top: 10px; padding-bottom: 8px; gap: 8px; }
  #q { padding: 7px 12px; }
  .areas { padding-top: 8px; padding-bottom: 8px; }
  .foot { padding-top: 6px; padding-bottom: 6px; }
  #saveNote { display: none; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
  h1 { font-size: 24px; }
  .tally { margin-left: 0; gap: 18px; }
  .tally b { font-size: 20px; }
  .row, .hood, .controls, .foot, .areas, .showing { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: reduce) { .leaflet-fade-anim .leaflet-popup, .leaflet-zoom-anim .leaflet-zoom-animated { transition: none !important; } }
</style>

<div class="app">
  <header>
    <h1>Houston <span>Matchbox</span> Hunt</h1>
    <div class="tally" aria-live="polite">
      <div class="got"><b id="tGot">0</b><small>Collected</small></div>
      <div class="live"><b id="tLive">0</b><small>Still stocked</small></div>
      <div class="out"><b id="tOut">0</b><small>Reported out</small></div>
    </div>
  </header>
  <div id="map" role="application" aria-label="Map of Houston matchbox spots"></div>
  <aside>
    <div class="controls">
      <input id="q" type="search" placeholder="Search a name, street or neighborhood" aria-label="Search">
      <div class="chips" role="group" aria-label="Filter">
        <button data-f="todo" aria-pressed="true">To get</button>
        <button data-f="all" aria-pressed="false">All</button>
        <button data-f="got" aria-pressed="false">Collected</button>
        <button data-f="out" aria-pressed="false">Reported out</button>
      </div>
    </div>
    <div class="areas" id="areas" role="group" aria-label="Neighborhood"></div>
    <div class="areas cats" id="cats" role="group" aria-label="Type of food"></div>
    <div class="showing" id="showing" hidden><span id="showingText"></span><button id="showAll">Show all</button></div>
    <div class="list" id="list"></div>
    <div class="foot" id="foot">
      <span class="dot" style="background:var(--head)"></span>Still stocked
      <span class="dot" style="background:var(--sulfur);border:1.5px solid var(--sulfur-ink)"></span>Collected
      <span class="dot" style="border:2px dashed var(--out)"></span>Reported out
      <div id="saveNote"></div>
    </div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
/*PLACES_JS*/
</script>
<script>
/*ROADS_JS*/
</script>
<script>
(() => {
  const P = window.PLACES;
  const byId = Object.fromEntries(P.map(p => [p.id, p]));
  const state = { collected: {}, pins: {}, filter: "todo", area: null, cat: null, q: "", sel: null, dragging: null };

  // ---------- storage: artifact db when available, else this browser ----------
  // Each person's collection is their own: in the artifact store under their
  // private data/users/<id>/ subtree when they're signed in with write access,
  // otherwise in this browser. Pin fixes are shared, but only the owner's sync.
  const LS = "houston-matchbox-v1";
  const local = {
    load() { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch { return {}; } },
    save() { try { localStorage.setItem(LS, JSON.stringify({ collected: state.collected, pins: myPins })); } catch {} },
  };
  const saved = local.load();
  let myPins = saved.pins || {}, sharedPins = {};
  state.collected = saved.collected || {};
  state.pins = { ...myPins };
  let db = null, myDoc = null, unsubMine = null, canPins = false;
  const saveNote = document.getElementById("saveNote");
  saveNote.textContent = "Progress is saved in this browser.";

  async function connectDb() {
    if (!window.claude?.use) return;
    let user = null;
    try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch {}
    if (!db) return;
    canPins = (await user?.isOwner().catch(() => false)) ?? false;
    db.collection("pins").onSnapshot(snap => {
      sharedPins = {};
      snap.docs.forEach(d => { if (d.exists) { const v = d.data(); if (typeof v.lat === "number") sharedPins[d.id] = [v.lat, v.lng]; } });
      state.pins = canPins ? { ...sharedPins } : { ...sharedPins, ...myPins };
      placeMarkers();
    }, () => {});
    const uid = await user?.id().catch(() => null);
    if (!uid) return;
    myDoc = db.doc(`data/users/${uid}/collected`);
    let first = true;
    unsubMine = myDoc.onSnapshot(snap => {
      const remote = (snap.exists && snap.data().ids) || {};
      if (first) {
        // carry over anything ticked in this browser before syncing
        first = false;
        const merged = { ...state.collected, ...remote };
        state.collected = merged;
        if (Object.keys(merged).length !== Object.keys(remote).length) saveMine();
      } else state.collected = remote;
      if (myDoc) saveNote.textContent = "Your progress syncs to your Claude account.";
      local.save(); render();
    }, goLocal);
  }
  function goLocal() {
    unsubMine?.(); unsubMine = null; myDoc = null;
    saveNote.textContent = "Progress is saved in this browser.";
  }
  function saveMine() {
    if (!myDoc) return;
    const ids = Object.fromEntries(Object.entries(state.collected).filter(([id]) => byId[id]));
    myDoc.set({ ids }).catch(goLocal);
  }
  function savePin(id, ll) {
    if (canPins && db) db.collection("pins").doc(id).set({ lat: ll[0], lng: ll[1] }).catch(() => {});
    else { myPins[id] = ll; local.save(); }
  }

  // ---------- derived ----------
  const isOut = p => !!p.gone;
  const isGot = p => !!state.collected[p.id];
  const where = p => state.pins[p.id] || [p.lat, p.lng];
  function status(p) { return isGot(p) ? "got" : isOut(p) ? "out" : "live"; }
  const inArea = p => !state.area || p.hood === state.area;
  const inCat = p => !state.cat || p.cat === state.cat;
  function visible(p) { return passes(p) && inArea(p) && inCat(p); }
  function passes(p) {
    const f = state.filter;
    if (f === "todo" && isGot(p)) return false;
    if (f === "got" && !isGot(p)) return false;
    if (f === "out" && !isOut(p)) return false;
    if (state.q) {
      const hay = (p.name + " " + p.addr + " " + p.hood + " " + (p.kind || "") + " " + (p.inside || "") + " " + p.cat).toLowerCase();
      if (!state.q.split(/\s+/).every(t => hay.includes(t))) return false;
    }
    return true;
  }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const q = p => encodeURIComponent(p.name + " " + p.addr.split(",")[0] + " Houston TX");
  const isShop = p => /shop|clothing|gifts|salon|menswear/i.test(p.kind || "");
  // Photos of other sites can't be shown inside the page, so each lookup opens in a new tab.
  const looks = p => [
    isShop(p)
      ? ["Website", "https://www.google.com/search?q=" + q(p), "M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18"]
      : ["Menu", "https://www.google.com/search?q=" + q(p) + "%20menu", "M6 3h12v18H6zM9 8h6M9 12h6M9 16h4"],
    ["Photos", "https://www.google.com/search?tbm=isch&q=" + q(p), "M3 6h18v13H3zM7 15l3-4 3 3 2-2 3 3M8.5 9.5h.01"],
    ["Reviews", "https://www.yelp.com/search?find_desc=" + encodeURIComponent(p.name) + "&find_loc=" + encodeURIComponent(p.addr + ", Houston, TX"), "M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"],
    ["Directions", gmaps(p), "M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21zM12 9.5h.01"],
  ];
  const gmaps = p => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(p.name + ", " + p.addr + ", Houston, TX");

  // ---------- map ----------
  const map = L.map("map", { zoomControl: true, preferCanvas: false, minZoom: 10, maxZoom: 18 }).setView([29.765, -95.42], 12);
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const base = L.layerGroup().addTo(map);
  map.createPane("minor").style.zIndex = 350;   // side streets sit under parks, bayous and main roads
  map.createPane("parks").style.zIndex = 340;
  const minorLayer = L.layerGroup();
  function drawBase() {
    base.clearLayers();
    const R = window.ROADS;
    const line = (pts, color, weight) => L.polyline(pts, { color, weight, opacity: 1, interactive: false, lineCap: "round", lineJoin: "round" }).addTo(base);
    R.parks.forEach(pk => L.polygon(pk.pts, { stroke: false, fillColor: css("--park"), fillOpacity: 1, interactive: false, smoothFactor: 2, pane: "parks" }).addTo(base));
    R.bayous.forEach(b => line(b.pts, css("--water"), 5));
    minorLayer.clearLayers();
    R.minor.forEach(pts => L.polyline(pts, { color: css("--road-edge"), weight: 1, opacity: .8, interactive: false, pane: "minor" }).addTo(minorLayer));
    R.streets.forEach(st => line(st.pts, css("--road-edge"), 2.5));
    const fw = [R.loop, ...R.freeways.map(f => f.pts)];
    fw.forEach(pts => line(pts, css("--road-edge"), 7));
    fw.forEach(pts => line(pts, css("--road"), 4.5));
    const lbl = (txt, at, cls) => L.marker(at, { interactive: false, keyboard: false, icon: L.divIcon({ className: cls, html: esc(txt), iconSize: null }) }).addTo(base);
    R.labels.forEach(([t, la, ln]) => lbl(t, [la, ln], "hood-label"));
    R.parks.forEach(pk => pk.label && lbl(pk.name, pk.label, "road-label"));
    R.freeways.forEach(f => lbl(f.name, f.pts[1], "road-label"));
    lbl("610", R.loop[1], "road-label");
    R.streets.forEach(st => lbl(st.name, st.pts[Math.floor(st.pts.length / 2)], "road-label"));
  }
  drawBase();
  // Name labels beside pins once zoomed in far enough for them not to pile up.
  const syncLabels = () => { const c = map.getContainer().classList, z = map.getZoom(); c.toggle("labels-on", z >= 16); c.toggle("far", z < 13); if (map.hasLayer(base)) { if (z >= 14) minorLayer.addTo(map); else minorLayer.remove(); } };
  map.on("zoomend", syncLabels); syncLabels();

  // Real streets where the browser is allowed to load them (outside claude.ai).
  const tiles = L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
    subdomains: "abcd", maxZoom: 19,
  });
  tiles.once("tileload", () => {
    map.removeLayer(base); minorLayer.remove();
    map.attributionControl.addAttribution('&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>');
  });
  tiles.addTo(map);

  const markers = {};
  function icon(p) {
    const cls = ["pin", status(p)];
    if (state.sel === p.id) cls.push("sel");
    if (state.dragging === p.id) cls.push("drag");
    return L.divIcon({ className: "", html: `<div class="${cls.join(" ")}"></div>`, iconSize: [20, 20], iconAnchor: [10, 10], popupAnchor: [0, -12] });
  }
  function placeMarkers() {
    P.forEach(p => {
      let m = markers[p.id];
      if (!m) {
        m = markers[p.id] = L.marker(where(p), { icon: icon(p), title: p.name, riseOnHover: true });
        m.bindPopup(() => popup(p), { autoPanPadding: [30, 30] });
        m.bindTooltip(`<small>${esc(p.kind || p.cat)}</small><b>${esc(p.name)}</b>`, { permanent: true, direction: "right", offset: [12, 0], className: "plabel", interactive: false });
        m.on("popupopen", () => select(p.id, false));
        m.on("dragend", () => {
          const ll = m.getLatLng();
          state.pins[p.id] = [ll.lat, ll.lng];
          savePin(p.id, [ll.lat, ll.lng]);
          m.dragging.disable(); state.dragging = null; m.setIcon(icon(p));
          toast("Pin moved for " + p.name);
        });
      } else if (state.dragging !== p.id) m.setLatLng(where(p));
      m.setIcon(icon(p));
      const show = visible(p) || state.sel === p.id;
      if (show && !map.hasLayer(m)) m.addTo(map);
      if (!show && map.hasLayer(m)) map.removeLayer(m);
      m.setZIndexOffset(state.sel === p.id ? 1000 : status(p) === "live" ? 100 : 0);
    });
  }

  function popup(p) {
    const el = document.createElement("div");
    el.className = "pop";
    const got = isGot(p);
    const siblings = P.filter(o => o.id !== p.id && o.addr === p.addr).map(o => o.name);
    el.innerHTML = `
      <div class="k">${esc(p.hood)} · ${esc(p.kind || p.cat)}</div>
      <h3>${esc(p.name)}</h3>
      ${p.inside ? `<div class="k">Inside ${esc(p.inside)}</div>` : ""}
      <div class="a">${esc(p.addr)}</div>
      <p class="n">${esc(p.note)}.</p>
      ${p.gone ? `<p class="n"><strong>Reported out of matches, ${esc(p.gone)}.</strong> Worth asking anyway.</p>` : ""}
      ${p.catGuess ? `<p class="warn">Listed under ${esc(p.cat)} as a best guess.</p>` : ""}
      ${siblings.length ? `<p class="warn">Same address: ${siblings.map(esc).join(", ")}.</p>` : ""}
      ${p.approx && !state.pins[p.id] ? `<p class="warn">Pin is an estimate. Use Directions for the exact spot, or Move pin to fix it.</p>` : ""}
      <div class="look">
        ${looks(p).map(([label, href, d]) => `<a href="${href}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>${label}</a>`).join("")}
      </div>
      <div class="acts">
        <button class="primary ${got ? "on" : ""}" data-a="toggle">${got ? "Collected ✓" : "Mark collected"}</button>
        <button data-a="move">Move pin</button>
        ${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">Website</a>` : ""}
      </div>`;
    el.addEventListener("click", e => {
      const a = e.target.closest("[data-a]")?.dataset.a;
      if (a === "toggle") { toggle(p.id); markers[p.id].setPopupContent(popup(p)); }
      if (a === "move") {
        const m = markers[p.id];
        m.closePopup(); state.dragging = p.id; m.setIcon(icon(p)); m.dragging.enable();
        toast("Drag the pin to the right spot");
      }
    });
    return el;
  }

  // ---------- list ----------
  const list = document.getElementById("list");
  // Two chip rows: neighborhood, then type of food. Each row's counts respect the other row's pick.
  const rows = [
    { el: document.getElementById("areas"), key: "area", all: "All areas", field: "hood", other: inCat, order: null },
    { el: document.getElementById("cats"), key: "cat", all: "All types", field: "cat", other: inArea, order: window.CATEGORIES },
  ];
  function renderAreas() {
    rows.forEach(r => {
      const counts = {};
      P.filter(p => passes(p) && r.other(p)).forEach(p => counts[p[r.field]] = (counts[p[r.field]] || 0) + 1);
      const sel = state[r.key];
      if (sel && !counts[sel]) counts[sel] = 0;
      const names = r.order ? r.order.filter(n => n in counts) : Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b));
      const total = names.reduce((n, h) => n + counts[h], 0);
      r.el.innerHTML = [`<button data-v="" aria-pressed="${!sel}">${r.all}<span>${total}</span></button>`]
        .concat(names.map(h => `<button data-v="${esc(h)}" aria-pressed="${sel === h}">${esc(h)}<span>${counts[h]}</span></button>`)).join("");
    });
  }
  rows.forEach(r => r.el.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    state[r.key] = b.dataset.v || null;
    render();
    list.scrollTop = 0;
    const pts = P.filter(visible).map(where);
    if (pts.length) map.flyToBounds(pts, { padding: [40, 40], maxZoom: 16, duration: matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : .6 });
    r.el.querySelector('[aria-pressed="true"]')?.scrollIntoView({ inline: "nearest", block: "nearest" });
  }));
  function render() {
    renderAreas();
    const vis = P.filter(visible);
    const hidden = P.length - vis.length;
    document.getElementById("showing").hidden = hidden === 0;
    document.getElementById("showingText").textContent = `Showing ${vis.length} of ${P.length}` + (state.filter === "todo" && !state.area && !state.cat && !state.q ? " (collected ones are hidden)" : "");
    const groups = {};
    vis.forEach(p => (groups[p.hood] ||= []).push(p));
    const hoods = Object.keys(groups).sort((a, b) => groups[b].length - groups[a].length || a.localeCompare(b));
    list.innerHTML = hoods.length ? "" : `<div class="empty">${state.filter === "got" && !state.q ? "Nothing collected yet. Tap the little box next to a spot once you have its matches." : "No spots match that."}</div>`;
    hoods.forEach(h => {
      const head = document.createElement("div");
      head.className = "hood";
      head.innerHTML = `<span>${esc(h)}</span><span>${groups[h].length}</span>`;
      list.appendChild(head);
      groups[h].sort((a, b) => a.name.localeCompare(b.name)).forEach(p => {
        const s = status(p);
        const row = document.createElement("div");
        row.className = "row" + (s === "out" ? " out" : "") + (state.sel === p.id ? " sel" : "");
        row.dataset.id = p.id;
        row.innerHTML = `
          <button class="box" aria-pressed="${isGot(p)}" aria-label="Collected ${esc(p.name)}"></button>
          <div><div class="nm">${esc(p.name)}${p.inside ? ` <em>in ${esc(p.inside)}</em>` : ""}</div><div class="ad">${esc(p.addr)} · ${esc(p.cat)}</div></div>
          <span class="pill ${s}">${s === "got" ? "Got it" : s === "out" ? "Out " + esc(p.gone.replace(/(\w{3})\w* (\d{4})/, "$1 ’$2").replace("’20", "’")) : "Stocked"}</span>`;
        list.appendChild(row);
      });
    });
    document.getElementById("tGot").textContent = P.filter(isGot).length + " / " + P.length;
    document.getElementById("tLive").textContent = P.filter(p => !isOut(p)).length;
    document.getElementById("tOut").textContent = P.filter(isOut).length;
    placeMarkers();
  }
  list.addEventListener("click", e => {
    const row = e.target.closest(".row"); if (!row) return;
    if (e.target.closest(".box")) { toggle(row.dataset.id); return; }
    select(row.dataset.id, true);
  });

  function toggle(id) {
    const p = byId[id];
    if (state.collected[id]) { delete state.collected[id]; toast("Unmarked " + p.name); }
    else { state.collected[id] = new Date().toISOString(); toast("Collected " + p.name + "!"); }
    local.save(); saveMine(); render();
  }
  function select(id, fly) {
    const prev = state.sel; state.sel = id;
    if (prev !== id) render();
    if (fly) {
      const m = markers[id];
      map.flyTo(where(byId[id]), Math.max(map.getZoom(), 15), { duration: matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : .6 });
      setTimeout(() => m.openPopup(), 650);
    } else {
      list.querySelector(`.row[data-id="${id}"]`)?.scrollIntoView({ block: "nearest" });
    }
  }
  map.on("popupclose", () => { state.sel = null; render(); });

  document.querySelectorAll(".chips button").forEach(b => b.addEventListener("click", () => {
    state.filter = b.dataset.f;
    document.querySelectorAll(".chips button").forEach(o => o.setAttribute("aria-pressed", o === b));
    render();
  }));
  document.getElementById("showAll").addEventListener("click", () => {
    state.area = null; state.cat = null; state.q = ""; document.getElementById("q").value = "";
    document.querySelector('.chips [data-f="all"]').click();
    map.flyToBounds(P.map(where), { padding: [30, 30], duration: matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : .6 });
  });
  document.getElementById("q").addEventListener("input", e => { state.q = e.target.value.trim().toLowerCase(); render(); });

  let tt;
  function toast(msg) {
    let t = document.querySelector(".toast");
    if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
    t.textContent = msg; t.hidden = false;
    clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 2200);
  }

  render();
  connectDb();
})();
</script>
